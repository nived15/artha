# Screener.in column mapping template (plan.md §13.4, implementation_plan.md Phase 1).
#
# Maps this codebase's canonical field names (artha/data/fields.py) to the
# ACTUAL column headers Screener.in gives you when you export a custom
# screen's CSV. Vendor column wording can drift or be renamed via custom
# ratios, so this mapping is a per-user, editable artifact — not hardcoded
# in the Python package.
#
# Copy this file to config/screener_field_map.toml and adjust if your own
# export's column headers differ. Core + shareholding fields below are
# confirmed against a real Screener Premium export
# (screener_exports/artha-profile-1-validation.csv, 2026-08-30). Phase 2
# fields were confirmed separately against a later, richer export
# (screener_exports/financial-services.csv, 2026-08-30) that added several
# custom ratios not present in the original Profile 1 export — column
# *names* are a Screener platform property, not a per-screen one, so the
# same mapping applies regardless of which profile's universe produced it.
# Anything still marked <TODO> genuinely has no confirmed native field —
# see docs/phase1_validation_spike.md for the full research trail.

[profile_1_standard]
market_cap = "Market Capitalization"
price = "Current Price"
roce = "Return on capital employed"
roe = "Return on equity"
debt_to_equity = "Debt to equity"
opm = "OPM"
sales_growth_3y = "Sales growth 3Years"
profit_growth_3y = "Profit growth 3Years"
pe_ratio = "Price to Earning"
peg_ratio = "Artha PEG"
ebit = "EBIT"
net_working_capital_ex_cash_ex_debt = "Artha NWC"
net_fixed_assets_ex_goodwill = "Net block"
enterprise_value = "Enterprise Value"
promoter_holding_pct = "Promoter holding"
promoter_pledge_pct = "Pledged percentage"
promoter_holding_trend_3y = "Change in promoter holding 3Years"

# Phase 2 screening fields (plan.md §5.3) — not part of the §13.4 spike's
# column-ceiling/shareholding checks, so a <TODO> here does not fail
# `artha data import-screener`; it surfaces as a per-criterion
# "needs Stage 1b data" note on the specific screen instead.
#
# OCF/PAT is deliberately absent: confirmed not exportable from Screener, so
# cash conversion is a Stage 3 filing-review item, not a Stage 1a field.
# Confirmed 2026-08-30 against screener_exports/financial-services.csv
# (654 rows): price_to_book 94.6%, profit_growth_5y 74.8%,
# eps_growth_ttm_yoy 97.6%, eps_growth_latest_q_yoy 96.2%,
# interest_coverage 72.8%, fcf_conversion_pct 99.5%, dividend_yield_pct
# 100%, sector 100%. ("Interest Coverage" and "Interest Coverage Ratio"
# are two identically-valued columns in that export; picked the shorter
# name — either resolves the same data.)
current_ratio = "Current ratio"
price_to_book = "Price to book value"
profit_growth_5y = "Profit growth 5Years"
eps_growth_ttm_yoy = "TTM EPS Growth vs Previous Year Annual YoY"
eps_growth_latest_q_yoy = "YoY EPS growth in the latest quarter"
gross_margin = "<TODO: still no separate gross-margin field confirmed (only OPM, which is operating margin — a different metric, already mapped to 'opm'); would need Sales/COGS split, not present>"
interest_coverage = "Interest Coverage"
fcf_conversion_pct = "FCF Conversion PCT"
years_since_incorporation = "<TODO: still not a Screener field — needs a per-company lookup outside Screener>"
analyst_coverage_count = "<TODO: still not a native count field. The 2026-08-30 export's 'Expected quarterly EPS' column is 67.4% complete (441/654) — its own sparsity is the low-coverage signal per plan.md §13.3b, but its *value* is an EPS estimate, not a count, so it cannot be mapped directly to this threshold-checked field (track_b.py compares analyst_coverage_count <= 2) without corrupting the comparison>"
dividend_yield_pct = "Dividend yield"
sector = "Industry"

