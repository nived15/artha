# Screener.in column mapping template (plan.md §13.4, implementation_plan.md Phase 1).
#
# Maps this codebase's canonical field names (artha/data/fields.py) to the
# ACTUAL column headers Screener.in gives you when you export a custom
# screen's CSV. Vendor column wording can drift or be renamed via custom
# ratios, so this mapping is a per-user, editable artifact — not hardcoded
# in the Python package.
#
# Copy this file to config/screener_field_map.toml and fill in the real
# column headers from your own "Create New Screen" export (screener.in),
# one section per §5.3a arithmetic profile. Names below are desk-research
# best guesses (see docs/phase1_validation_spike.md) — confirm every one
# against a real export before relying on it; anything marked <TODO> could
# not be confirmed without an actual Screener Premium account and needs a
# custom ratio or a different vendor column.

[profile_1_standard]
market_cap = "Market Capitalization"
price = "Current price"
roce = "Return on capital employed"
roe = "Return on equity"
debt_to_equity = "Debt to equity"
opm = "OPM"
sales_growth_3y = "Sales growth 3Years"
profit_growth_3y = "Profit growth 3Years"
pe_ratio = "Price to Earning"
peg_ratio = "<TODO: no confirmed native field — try custom ratio 'Price to Earning / Profit growth 3Years', confirm against a real export>"
ebit = "EBIT"
net_working_capital_ex_cash_ex_debt = "<TODO: custom ratio 'Current Assets - Current Liabilities'; Greenblatt's ex-excess-cash/ex-short-term-debt refinement needs the Cash and Investments fields split out — confirm on a real export (docs/phase1_validation_spike.md §2)>"
net_fixed_assets_ex_goodwill = "Net Block"
enterprise_value = "Enterprise Value"
promoter_holding_pct = "Promoter holding"
promoter_pledge_pct = "Pledged percentage"
promoter_holding_trend_3y = "Change in promoter holding 3Years"

