[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artha"
version = "0.1.0"
description = "Artha — a disciplined, documented Indian-equity research and execution pipeline."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
artha = "artha.cli.main:cli"

[tool.setuptools.packages.find]
include = ["artha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
